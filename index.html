<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オセロ</title>
<style>
  :root { --bg: #ecf0f1; --ink: #2c3e50; --green: #27ae60; --line: #1e8449; --blue: #3498db; --red: #e74c3c; --yellow: #f1c40f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--ink); text-align: center; padding: 16px; }
  h1 { margin: 8px 0 16px; font-size: 2rem; }
  .btn { display: block; width: min(80vw, 280px); margin: 12px auto; padding: 16px; border: 0; border-radius: 12px; color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  .btn:focus-visible, .cell:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .pvp { background: var(--blue); } .cpu { background: var(--red); } .sub { background: var(--ink); width: auto; display: inline-block; padding: 10px 20px; margin: 8px 4px; font-size: 1rem; }
  #banner { width: min(92vw, 480px); margin: 0 auto 12px; padding: 12px; border-radius: 12px; font-size: 1.2rem; font-weight: 700; color: #fff; background: var(--ink); }
  #banner.turn-me { background: var(--blue); } #banner.win { background: var(--yellow); color: var(--ink); } #banner.lose { background: var(--red); }
  #score { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; font-weight: 700; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px; background: #fff; border: 3px solid transparent; }
  .chip.on { border-color: var(--blue); }
  .dot { width: 18px; height: 18px; border-radius: 50%; } .b { background: #111; } .w { background: #fff; border: 2px solid #111; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); width: min(92vw, 480px); margin: 0 auto 8px; background: var(--line); gap: 2px; padding: 2px; border-radius: 8px; }
  .cell { aspect-ratio: 1; background: var(--green); border: 0; padding: 0; position: relative; cursor: pointer; }
  .cell:disabled { cursor: default; }
  .cell.hint::after { content: ""; position: absolute; inset: 38%; border-radius: 50%; background: rgba(255,255,255,.55); }
  .disc { position: absolute; inset: 10%; border-radius: 50%; }
  .disc.b { background: #111; } .disc.w { background: #fff; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>オセロ</h1>

<section id="menu">
  <p>モードを選んでください</p>
  <button class="btn pvp" data-mode="pvp">👥 対人戦(2人で遊ぶ)</button>
  <button class="btn cpu" data-mode="cpu">🤖 CPU戦(あなたが黒)</button>
</section>

<section id="game" hidden>
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="score"></div>
  <div id="board"></div>
  <button class="btn sub" id="reset">もう一度</button>
  <button class="btn sub" id="back">モード選択へ</button>
</section>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="game.js"></script>
<script>
let board, turn, mode, over, note, timer;
const $ = id => document.getElementById(id);
const NAME = { 1: '黒', 2: '白' };
const cpuTurn = () => mode === 'cpu' && turn === 2;

function start(m) {
  if (m) mode = m;
  clearTimeout(timer);
  board = newBoard(); turn = 1; over = false; note = '';
  $('menu').hidden = true; $('game').hidden = false;
  render();
}

function click(i) {
  if (over || cpuTurn()) return;
  move(i);
}

function move(i) {
  const n = play(board, i, turn);
  if (!n) return;
  const mover = turn;
  board = n; note = '';
  turn = 3 - turn;
  if (!legalMoves(board, turn).length) {
    if (!legalMoves(board, mover).length) over = true;
    else { note = `${who(turn)}は置ける場所がないのでパスしました。`; turn = mover; }
  }
  render();
  if (over) finish();
  else if (cpuTurn()) timer = setTimeout(() => move(cpuMove(board, 2)), 700);
}

const who = p => mode === 'cpu' ? (p === 1 ? 'あなた' : 'CPU') : NAME[p];

function count(p) { return board.filter(x => x === p).length; }

function render() {
  const moves = over || cpuTurn() ? [] : legalMoves(board, turn);
  $('board').replaceChildren(...board.map((v, i) => {
    const c = document.createElement('button');
    c.className = 'cell' + (moves.includes(i) ? ' hint' : '');
    c.disabled = !moves.includes(i);
    c.setAttribute('aria-label', `${'ABCDEFGH'[i & 7]}${(i >> 3) + 1}`);
    if (v) c.innerHTML = `<span class="disc ${v === 1 ? 'b' : 'w'}"></span>`;
    c.onclick = () => click(i);
    return c;
  }));
  const k = count(1), w = count(2);
  $('score').innerHTML = [1, 2].map(p =>
    `<div class="chip${!over && turn === p ? ' on' : ''}"><span class="dot ${p === 1 ? 'b' : 'w'}"></span>${who(p)} ${p === 1 ? k : w}</div>`).join('');
  const b = $('banner');
  if (over) return;
  b.className = mode === 'cpu' && turn === 1 ? 'turn-me' : '';
  b.textContent = note + (mode === 'cpu'
    ? (turn === 1 ? 'あなたの番です(黒)' : 'CPUが考え中…')
    : `${NAME[turn]}の番です`);
}

function finish() {
  const k = count(1), w = count(2), b = $('banner');
  const winner = k === w ? 0 : k > w ? 1 : 2;
  const text = winner === 0 ? '引き分け!' : mode === 'cpu'
    ? (winner === 1 ? '🎉 あなたの勝ち!' : '😢 CPUの勝ち…')
    : `🎉 ${NAME[winner]}の勝ち!`;
  b.textContent = `${text}(黒 ${k} - 白 ${w})`;
  b.className = winner === 0 ? '' : (mode === 'cpu' && winner === 2 ? 'lose' : 'win');
  $('score').querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  if (winner && !(mode === 'cpu' && winner === 2)) confetti();
}

// small canvas confetti; skipped when the user prefers reduced motion
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#e74c3c', '#f1c40f', '#3498db', '#27ae60', '#9b59b6'];
  const ps = Array.from({ length: 160 }, () => ({
    x: cv.width / 2, y: cv.height * 0.4,
    vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 14 - 4,
    s: 6 + Math.random() * 6, r: Math.random() * 6, c: colors[Math.random() * 5 | 0],
  }));
  const end = performance.now() + 4000;
  (function frame(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.vy += 0.3; p.x += p.vx; p.y += p.vy; p.r += 0.2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s / 2);
      ctx.restore();
    });
    if (t < end) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(performance.now());
}

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => start(b.dataset.mode));
$('reset').onclick = () => start();
$('back').onclick = () => { clearTimeout(timer); $('game').hidden = true; $('menu').hidden = false; };
</script>
</body>
</html>
